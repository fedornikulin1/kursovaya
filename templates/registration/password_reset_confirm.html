{% extends "base.html" %}
{% block content %}
  <div class="surface auth-surface">
    <h1>Новый пароль</h1>
    {% if validlink %}
      <form method="post">
        {% csrf_token %}
        {% include "components/fields.html" %}
        <button class="btn btn-primary" type="submit">Сохранить</button>
      </form>
    {% else %}
      <p>Ссылка недействительна или уже использована.</p>
      <a href="{% url 'password_reset' %}">Запросить новую</a>
    {% endif %}
  </div>
{% endblock %}
