{% if form.non_field_errors %}
  <div class="form-errors" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <div class="form-field {% if field.field.widget.input_type == 'checkbox' %}checkbox-field{% endif %}">
    <label for="{{ field.id_for_label }}">
      {{ field.label }}{% if field.field.required %}<span class="required"> *</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}
      <div class="field-help">{{ field.help_text|safe }}</div>
    {% endif %}
    {% if field.errors %}
      <div class="field-errors" role="alert">{{ field.errors }}</div>
    {% endif %}
  </div>
{% endfor %}
