components:
  schemas:
    ActionEnum:
      enum:
      - confirm
      - cancel
      - handover
      - receive
      - return
      - finish_return
      type: string
      description: |-
        * `confirm` - confirm
        * `cancel` - cancel
        * `handover` - handover
        * `receive` - receive
        * `return` - return
        * `finish_return` - finish_return
    Ad:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Название
          maxLength: 200
        description:
          type: string
          title: Описание
          maxLength: 10000
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: Цена
        price_type:
          allOf:
          - $ref: '#/components/schemas/PriceTypeEnum'
          title: Формат цены
        price_label:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          title: Тип объявления
        status:
          allOf:
          - $ref: '#/components/schemas/AdStatusEnum'
          title: Статус
        image:
          type: string
          format: uri
          nullable: true
          title: Обложка
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          readOnly: true
        category:
          type: integer
          title: Категория
        category_name:
          type: string
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        location:
          type: string
          title: Место встречи
          maxLength: 150
        is_study:
          type: boolean
          title: Для учебного обмена
        subject:
          type: string
          title: Предмет
          maxLength: 120
        course:
          type: integer
          maximum: 6
          minimum: 1
          nullable: true
          title: Курс
        semester:
          type: integer
          maximum: 12
          minimum: 1
          nullable: true
          title: Семестр
        campus_place:
          type: integer
          nullable: true
          title: Место в кампусе
        available_from:
          type: string
          format: date-time
          nullable: true
          title: Можно забрать с
        available_until:
          type: string
          format: date-time
          nullable: true
          title: Можно забрать до
        exchange_for:
          type: string
          title: На что обменяю
          maxLength: 200
        condition:
          allOf:
          - $ref: '#/components/schemas/ConditionEnum'
          title: Состояние
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Изменено
        is_favorite:
          type: boolean
          readOnly: true
          default: false
      required:
      - author
      - category
      - category_name
      - created_at
      - description
      - id
      - images
      - is_favorite
      - price_label
      - title
      - updated_at
    AdRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          title: Название
          maxLength: 200
        description:
          type: string
          minLength: 1
          title: Описание
          maxLength: 10000
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: Цена
        price_type:
          allOf:
          - $ref: '#/components/schemas/PriceTypeEnum'
          title: Формат цены
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          title: Тип объявления
        status:
          allOf:
          - $ref: '#/components/schemas/AdStatusEnum'
          title: Статус
        image:
          type: string
          format: binary
          nullable: true
          title: Обложка
        category:
          type: integer
          title: Категория
        location:
          type: string
          minLength: 1
          title: Место встречи
          maxLength: 150
        is_study:
          type: boolean
          title: Для учебного обмена
        subject:
          type: string
          title: Предмет
          maxLength: 120
        course:
          type: integer
          maximum: 6
          minimum: 1
          nullable: true
          title: Курс
        semester:
          type: integer
          maximum: 12
          minimum: 1
          nullable: true
          title: Семестр
        campus_place:
          type: integer
          nullable: true
          title: Место в кампусе
        available_from:
          type: string
          format: date-time
          nullable: true
          title: Можно забрать с
        available_until:
          type: string
          format: date-time
          nullable: true
          title: Можно забрать до
        exchange_for:
          type: string
          title: На что обменяю
          maxLength: 200
        condition:
          allOf:
          - $ref: '#/components/schemas/ConditionEnum'
          title: Состояние
      required:
      - category
      - description
      - title
    AdStatusEnum:
      enum:
      - draft
      - active
      - closed
      - archived
      type: string
      description: |-
        * `draft` - Черновик
        * `active` - Опубликовано
        * `closed` - Закрыто
        * `archived` - В архиве
    Category:
