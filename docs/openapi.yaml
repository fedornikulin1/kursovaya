          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ad'
          description: ''
    delete:
      operationId: v1_ads_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Объявление.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
