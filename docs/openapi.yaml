      required:
      - rating
      - to_user
    RoleEnum:
      enum:
      - student
      - staff
      type: string
      description: |-
        * `student` - Студент
        * `staff` - Сотрудник
    SupportMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
          readOnly: true
          title: Сообщение
        from_staff:
          type: boolean
          readOnly: true
          title: Ответ поддержки
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Отправлено
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Прочитано пользователем
      required:
      - created_at
      - from_staff
      - id
      - read_at
      - text
    Ticket:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        subject:
          type: string
          readOnly: true
          title: Тема обращения
        topic:
          allOf:
          - $ref: '#/components/schemas/TopicEnum'
          readOnly: true
          title: Раздел
        status:
          allOf:
          - $ref: '#/components/schemas/TicketStatusEnum'
          readOnly: true
          title: Статус
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Обновлено
        unread_answers:
          type: integer
          readOnly: true
          default: 0
      required:
      - created_at
      - id
      - status
      - subject
      - topic
      - unread_answers
      - updated_at
    TicketStatusEnum:
      enum:
      - open
      - answered
      - closed
      type: string
      description: |-
        * `open` - Ожидает поддержки
        * `answered` - Поддержка ответила
        * `closed` - Закрыто
    TokenBlacklistRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TopicEnum:
      enum:
      - account
      - listing
      - messages
      - safety
      - idea
      - other
      type: string
      description: |-
        * `account` - Аккаунт и вход
        * `listing` - Объявления
        * `messages` - Сообщения
        * `safety` - Безопасность
        * `idea` - Идея для сайта
        * `other` - Другой вопрос
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
        first_name:
          type: string
          readOnly: true
          title: Имя
        last_name:
          type: string
          readOnly: true
          title: Фамилия
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Дата регистрации
      required:
      - date_joined
      - first_name
      - id
      - last_name
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
