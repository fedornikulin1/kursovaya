  /api/v1/ads/:
    get:
      operationId: v1_ads_list
      parameters:
      - in: query
        name: campus_place
        schema:
          type: integer
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: course
        schema:
          type: integer
      - in: query
        name: is_study
        schema:
          type: boolean
      - in: query
        name: kind
        schema:
          type: string
          title: Тип объявления
          enum:
          - buy
          - exchange
          - give
          - lend
          - roommate
          - sell
          - service
        description: |-
          * `sell` - Продам
          * `buy` - Куплю
          * `service` - Услуга
          * `roommate` - Ищу соседа
          * `exchange` - Обменяю
          * `give` - Отдам бесплатно
          * `lend` - Дам на время
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -date
            - -price
            - date
            - price
        description: |-
          Сортировка

          * `date` - Дата
          * `-date` - Дата (по убыванию)
          * `price` - Цена
          * `-price` - Цена (по убыванию)
        explode: false
        style: form
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: price_max
        schema:
          type: number
      - in: query
        name: price_min
        schema:
          type: number
      - in: query
        name: price_type
        schema:
          type: string
          title: Формат цены
          enum:
          - fixed
          - free
          - negotiable
        description: |-
          * `fixed` - Фиксированная
          * `free` - Бесплатно
          * `negotiable` - Договорная
      - in: query
        name: q
        schema:
          type: string
        description: Поиск
      - in: query
        name: semester
        schema:
          type: integer
      - in: query
        name: subject
        schema:
          type: string
      - in: query
        name: title
        schema:
          type: string
        description: Название
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdList'
          description: ''
    post:
      operationId: v1_ads_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ad'
          description: ''
